name: Build APK Lossless
# Compila TotK-LSFG.apk (la app con el boton "Lossless Scaling" para importar tu Lossless.dll).
# No hace falta tocar nada: Actions > "Build APK Lossless" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Descargar tu repositorio
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK y NDK
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-33" "build-tools;34.0.0" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Instalar dependencias de Python
        run: pip install cryptography==50.0.2

      - name: Anadir el boton Lossless Scaling a la app (parche)
        run: |
          set -e
          cat > "$RUNNER_TEMP/LsfgImport.java" <<'JAVA_EOF'
          package com.aure.totk.setup;

          import java.io.BufferedInputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.io.RandomAccessFile;

          /** Android-free import of the user's own Lossless.dll into files/lsfg/Lossless.dll. The file name is fixed, never taken
           * from the source. Until every read, check and the rename succeed, an earlier DLL stays untouched. */
          final class LsfgImport {
              static final long MIN_DLL = 256L << 10, MAX_DLL = 512L << 20;
              static final String NAME = "Lossless.dll";

              static final class Invalid extends IOException {
                  Invalid(String why) { super(why); }
              }

              static File dir(File filesDir) { return new File(filesDir, "lsfg"); }
              static File target(File filesDir) { return new File(dir(filesDir), NAME); }

              /** Owns/closes source. Returns the DLL size in bytes. */
              static long install(InputStream source, File target) throws IOException {
                  File parent = target.getParentFile();
                  if (parent != null && !parent.isDirectory() && !parent.mkdirs() && !parent.isDirectory())
                      throw new IOException("cannot create " + parent);
                  File temp = new File(target.getPath() + ".tmp");
                  try {
                      long total = 0;
                      try (InputStream in = new BufferedInputStream(source); OutputStream out = new FileOutputStream(temp)) {
                          byte[] buffer = new byte[1 << 16];
                          for (int n; (n = in.read(buffer)) > 0;) {
                              total += n;
                              if (total > MAX_DLL) throw new Invalid("too large");
                              out.write(buffer, 0, n);
                          }
                      }
                      if (total < MIN_DLL) throw new Invalid("too small");
                      check(temp);
                      if (target.exists() && !target.delete()) throw new IOException("old DLL could not be replaced");
                      if (!temp.renameTo(target)) throw new IOException("DLL rename failed");
                      return total;
                  } finally {
                      temp.delete();
                  }
              }

              /** A 64-bit x86 Windows DLL: MZ header, PE signature at e_lfanew, machine AMD64, DLL characteristic. */
              static void check(File file) throws IOException {
                  try (RandomAccessFile f = new RandomAccessFile(file, "r")) {
                      byte[] dos = new byte[64];
                      f.readFully(dos);
                      if (dos[0] != 'M' || dos[1] != 'Z') throw new Invalid("not a Windows file");
                      long pe = u32(dos, 60);
                      if (pe < 64 || pe > f.length() - 24) throw new Invalid("bad header");
                      f.seek(pe);
                      byte[] head = new byte[24];
                      f.readFully(head);
                      if (head[0] != 'P' || head[1] != 'E' || head[2] != 0 || head[3] != 0) throw new Invalid("not a PE file");
                      if (u16(head, 4) != 0x8664) throw new Invalid("not 64-bit x86");
                      if ((u16(head, 22) & 0x2000) == 0) throw new Invalid("not a DLL");
                  }
              }

              private static int u16(byte[] b, int p) { return (b[p] & 255) | (b[p + 1] & 255) << 8; }
              private static long u32(byte[] b, int p) { return (u16(b, p) & 0xffffL) | (long) u16(b, p + 2) << 16; }
          }
          JAVA_EOF
          cat > "$RUNNER_TEMP/apply_lsfg_patch.py" <<'PY_EOF'
          #!/usr/bin/env python3
          """Adds a 'Lossless Scaling' import row to the TotK app (Game data screen).
          Usage: python3 apply_lsfg_patch.py <repo root> <path to LsfgImport.java>
          Every replacement must match exactly once, otherwise the build stops with a clear message."""
          import shutil, sys
          from pathlib import Path

          repo = Path(sys.argv[1])
          java = repo / "games/totk/android/java/com/aure/totk/setup"


          def edit(name, pairs):
              path = java / name
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  n = text.count(old)
                  if n != 1:
                      sys.exit(f"PATCH FAILED in {name}: expected 1 match, found {n} for:\n{old}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
              print("patched", name)


          shutil.copyfile(sys.argv[2], java / "LsfgImport.java")
          print("added LsfgImport.java")

          # ---------------------------------------------------------------- Strings
          edit("Strings.java", [(
              '    static final String RERUN = "Run setup again";\n',
              '''    static final String LSFG_ROW = "Lossless Scaling";
              static final String LSFG_HINT = "Your own Lossless.dll, used by Frame generation";
              static final String LSFG_NONE = "Not imported";
              static final String LSFG_READY = "Imported";
              static final String LSFG_QUALITY_ROW = "Lossless quality";
              static final String LSFG_QUALITY_HINT = "Used when Frame generation is On · tap to change";
              static final String LSFG_BAD = "That file is not a 64-bit Lossless.dll from Lossless Scaling.";
              static final String LSFG_DONE = "Lossless.dll imported. Set Frame generation to On to use it.";
              static final String LSFG_TEXT = "Pick the Lossless.dll from your own purchased copy of Lossless Scaling "
                      + "(Steam: Lossless Scaling folder). It is copied into the app's private storage and never uploaded. "
                      + "With Frame generation On, the game then uses it instead of the built-in generator. Pick the file again to replace it.";
              static final String LSFG_QUALITY_TEXT = "Fast uses the lighter model. Better and Best use a higher motion resolution, "
                      + "which usually reduces ghosting but costs frames per second. Needs the DLL imported and Frame generation On.";
              static String lsfgQuality(String value) { return "fast".equals(value) ? "Fast" : "best".equals(value) ? "Best" : "Better"; }
              static final String RERUN = "Run setup again";
          ''')])

          # ---------------------------------------------------------------- SettingsStore
          edit("SettingsStore.java", [
              ('            Settings.writeAtomic(context.getFilesDir(), ENV, settings.env(locale(), StorageLocation.envValue(context)));\n',
               '            Settings.writeAtomic(context.getFilesDir(), ENV,\n'
               '                    settings.env(locale(), StorageLocation.envValue(context)) + lsfgEnv(context, settings));\n'),
              ('    /** Rewrite settings.env (atomic, Settings.writeAtomic).',
               '''    /** Lossless Scaling engine lines: only with Frame generation On and an imported Lossless.dll. */
              static String lsfgEnv(Context context, Settings settings) {
                  if (!"on".equals(settings.get("frame_gen")) || !LsfgImport.target(context.getFilesDir()).isFile()) return "";
                  String quality = Inputs.prefs(context).getString("lsfgQuality", "better");
                  String perf = "fast".equals(quality) ? "1" : "0", flow = "best".equals(quality) ? "1.0" : "fast".equals(quality) ? "0.5" : "0.75";
                  return "TOTK_FRAMEGEN_ENGINE=lsfg\\nTOTK_LSFG_PERF=" + perf + "\\nTOTK_LSFG_FLOW=" + flow + "\\n";
              }
              /** Rewrite settings.env (atomic, Settings.writeAtomic).'''),
          ])

          # ---------------------------------------------------------------- SetupActivity
          edit("SetupActivity.java", [
              ('REQ_DATA_FOLDER = 906, REQ_ACCESS = 907;', 'REQ_DATA_FOLDER = 906, REQ_ACCESS = 907, REQ_LSFG = 908;'),
              ('Widgets.Row row = listRow(parent, "data:" + id, label, hint, 76, 8);',
               'Widgets.Row row = listRow(parent, "data:" + id, label, hint, 60, 6);'),
              ('        gameControl(reset, "Changing the driver", this::resetDriver);\n',
               '''        gameControl(reset, "Changing the driver", this::resetDriver);
                  File lsfgDll = LsfgImport.target(getFilesDir());
                  Widgets.Row lsfgRow = dataRow(list, "lsfg", Strings.LSFG_ROW, Strings.LSFG_HINT,
                          lsfgDll.isFile() ? Strings.LSFG_READY + " · " + Strings.bytes(lsfgDll.length()) : Strings.LSFG_NONE,
                          lsfgDll.isFile() ? Theme.ZONAI : Theme.AMBER, v -> pickLsfg());
                  Widgets.Row lsfgQuality = dataRow(list, "lsfg-quality", Strings.LSFG_QUALITY_ROW, Strings.LSFG_QUALITY_HINT,
                          Strings.lsfgQuality(Inputs.prefs(this).getString("lsfgQuality", "better")), Theme.ZONAI, v -> cycleLsfgQuality());
                  lsfgRow.dimmed(missing);
                  lsfgQuality.dimmed(!lsfgDll.isFile());
                  gameControl(lsfgRow, "Changing Lossless Scaling", this::pickLsfg);
          '''),
              ('            case "driver": case "driver-reset": detailText.setText(Strings.DRIVER_TEXT); break;\n',
               '''            case "driver": case "driver-reset": detailText.setText(Strings.DRIVER_TEXT); break;
                      case "lsfg": detailText.setText(Strings.LSFG_TEXT); break;
                      case "lsfg-quality": detailText.setText(Strings.LSFG_QUALITY_TEXT); break;
          '''),
              ('    private void confirmDelete() {\n',
               '''    private void pickLsfg() {
                  if (!needGameClosed("Changing Lossless Scaling", this::pickLsfg)) return;
                  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT).addCategory(Intent.CATEGORY_OPENABLE).setType("*/*");
                  try { startActivityForResult(intent, REQ_LSFG); } catch (ActivityNotFoundException noPicker) { showNote(Strings.PICKER_MISSING); }
              }

              private void cycleLsfgQuality() {
                  String now = Inputs.prefs(this).getString("lsfgQuality", "better");
                  String next = "fast".equals(now) ? "better" : "better".equals(now) ? "best" : "fast";
                  Inputs.prefs(this).edit().putString("lsfgQuality", next).apply();
                  SettingsStore.writeEnv(this, SettingsStore.load(this));
                  render();
              }

              /** Copy the user's own Lossless.dll to files/lsfg/Lossless.dll, where the frame-generation engine looks for it. */
              private void installLsfg(Uri uri) {
                  if (!needGameClosed("Changing Lossless Scaling", () -> installLsfg(uri))) return;
                  ContentResolver resolver = getContentResolver();
                  worker.execute(() -> {
                      String outcome = null;
                      File direct = FileAccess.directFile(this, uri, -1);
                      try (GameLock.Hold held = GameLock.hold(getFilesDir())) {
                          held.requireFree();
                          InputStream in = direct != null ? new java.io.FileInputStream(direct) : resolver.openInputStream(uri);
                          if (in == null) throw new IOException("unreadable");
                          LsfgImport.install(in, LsfgImport.target(getFilesDir()));
                          SettingsStore.writeEnv(this, SettingsStore.load(this));
                      } catch (LsfgImport.Invalid failed) {
                          outcome = Strings.LSFG_BAD;
                      } catch (IOException | SecurityException failed) {
                          outcome = Strings.gameLockError(failed.toString());
                      }
                      String message = outcome;
                      main.post(() -> { note = message == null ? Strings.LSFG_DONE : message; noteOk = message == null; if (screen == Screen.DATA) render(); });
                  });
              }

              private void confirmDelete() {
          '''),
              ('        if (request == REQ_DRIVER) { if (data.getData() != null) installDriver(data.getData()); return; }\n',
               '''        if (request == REQ_DRIVER) { if (data.getData() != null) installDriver(data.getData()); return; }
                  if (request == REQ_LSFG) { if (data.getData() != null) installLsfg(data.getData()); return; }
          '''),
          ])
          print("OK: all patches applied")
          PY_EOF
          python3 "$RUNNER_TEMP/apply_lsfg_patch.py" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/LsfgImport.java"

      - name: Obtener el driver Turnip y el traductor del APK oficial v1.0.1
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/official.apk" https://github.com/AurelioB/totk-android/releases/download/v1.0.1/TotK-Native-1.0.1.apk
          echo "5f590c91b3af683b26fea74c121890d7439d97b687ad4a34eff7660ca75399d5  $RUNNER_TEMP/official.apk" | sha256sum -c -
          python3 - <<'PY_EOF'
          import os, zipfile
          tmp = os.environ['RUNNER_TEMP']
          z = zipfile.ZipFile(tmp + '/official.apk')
          open(tmp + '/driver.so', 'wb').write(z.read('lib/arm64-v8a/libtotk_turnip.so'))
          open(tmp + '/totk_xlate', 'wb').write(z.read('lib/arm64-v8a/libtotk_xlate.so'))
          PY_EOF

      - name: Compilar el APK (tarda mucho, es normal)
        env:
          KEY_B64: 
        run: |
          set -e
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/personal.pem"
          python3 games/totk/android/build_release.py \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --turnip "$RUNNER_TEMP/driver.so" \
            --translator "$RUNNER_TEMP/totk_xlate" \
            --key "$RUNNER_TEMP/personal.pem" \
            --version-name 1.0.1-lsfg \
            --work "$RUNNER_TEMP/work" \
            -o "$GITHUB_WORKSPACE/TotK-LSFG.apk" \
            --jobs "$(nproc)"
          ls -la "$GITHUB_WORKSPACE/TotK-LSFG.apk"

      - name: Guardar el APK como archivo de la ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: TotK-LSFG
          path: TotK-LSFG.apk

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lsfg-latest --yes --cleanup-tag || true
          gh release create lsfg-latest TotK-LSFG.apk --title "TotK-LSFG (Lossless Scaling)" --notes "APK con importador de Lossless.dll. Descargalo y instalalo en tu consola." --target "$GITHUB_SHA"
