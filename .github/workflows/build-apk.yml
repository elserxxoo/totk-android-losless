name: Build APK Lossless FIX
# Corrige el selector de Lossless.dll. Usa el parche que ya esta dentro de build-apk.yml
# (NO borres ese archivo) y le cambia el codigo de peticion que chocaba (908 -> 920).
# Uso: Actions > "Build APK Lossless FIX" > Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK y NDK
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL -o "$RUNNER_TEMP/clt.zip" https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q "$RUNNER_TEMP/clt.zip" -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platforms;android-33" "build-tools;34.0.0" "ndk;28.2.13676358" > /dev/null
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

      - name: Instalar dependencias de Python
        run: pip install cryptography==50.0.2

      - name: Aplicar parche Lossless corregido
        run: |
          set -e
          python3 - <<'PY_EOF'
          import os, subprocess, sys
          tmp = os.environ['RUNNER_TEMP']
          lines = open('.github/workflows/build-apk.yml', encoding='utf-8').read().split('\n')

          def heredoc(marker):
              out, on = [], False
              for l in lines:
                  if not on and l.rstrip().endswith("<<'" + marker + "'"):
                      on = True
                      continue
                  if on:
                      if l.strip() == marker:
                          break
                      out.append(l[10:] if l.startswith(' ' * 10) else l.strip())
              if not out:
                  sys.exit('No encuentro ' + marker + ' en build-apk.yml (no lo borres ni lo cambies)')
              return '\n'.join(out) + '\n'

          java = heredoc('JAVA_EOF')
          patch = heredoc('PY_EOF')
          # EL ERROR: 908 es el mismo codigo que usa el instalador de actualizaciones (REQUEST_SOURCES),
          # asi que al volver del selector la app ignoraba el archivo.
          assert 'REQ_LSFG = 908' in patch, 'parche inesperado'
          patch = patch.replace('REQ_LSFG = 908', 'REQ_LSFG = 920')
          bad = 'outcome = Strings.LSFG_BAD;'
          assert bad in patch, 'parche inesperado (2)'
          patch = patch.replace(bad, 'outcome = Strings.LSFG_BAD + " (" + failed.getMessage() + ")";')
          open(tmp + '/LsfgImport.java', 'w', encoding='utf-8').write(java)
          open(tmp + '/apply_lsfg_patch.py', 'w', encoding='utf-8').write(patch)
          subprocess.check_call([sys.executable, tmp + '/apply_lsfg_patch.py', os.getcwd(), tmp + '/LsfgImport.java'])
          PY_EOF
          grep -n "REQ_LSFG" games/totk/android/java/com/aure/totk/setup/SetupActivity.java

      - name: Obtener el driver Turnip y el traductor del APK oficial v1.0.1
        run: |
          set -e
          curl -fsSL -o "$RUNNER_TEMP/official.apk" https://github.com/AurelioB/totk-android/releases/download/v1.0.1/TotK-Native-1.0.1.apk
          echo "5f590c91b3af683b26fea74c121890d7439d97b687ad4a34eff7660ca75399d5  $RUNNER_TEMP/official.apk" | sha256sum -c -
          python3 - <<'PY_EOF'
          import os, zipfile
          tmp = os.environ['RUNNER_TEMP']
          z = zipfile.ZipFile(tmp + '/official.apk')
          open(tmp + '/driver.so', 'wb').write(z.read('lib/arm64-v8a/libtotk_turnip.so'))
          open(tmp + '/totk_xlate', 'wb').write(z.read('lib/arm64-v8a/libtotk_xlate.so'))
          PY_EOF

      - name: Clave de firma (la misma de build-apk.yml, asi se actualiza encima)
        run: |
          set -e
          KEY_B64=$(grep -m1 -E '^[[:space:]]*KEY_B64:' .github/workflows/build-apk.yml | sed -E 's/^[[:space:]]*KEY_B64:[[:space:]]*//' | tr -d "\"' \r")
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/personal.pem"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/personal.pem" || { echo "::error::No encuentro la clave en build-apk.yml"; exit 1; }

      - name: Compilar el APK (tarda mucho, es normal)
        run: |
          set -e
          python3 games/totk/android/build_release.py \
            --ndk "$ANDROID_HOME/ndk/28.2.13676358" \
            --turnip "$RUNNER_TEMP/driver.so" \
            --translator "$RUNNER_TEMP/totk_xlate" \
            --key "$RUNNER_TEMP/personal.pem" \
            --version-name 1.0.1-lsfg2 \
            --work "$RUNNER_TEMP/work" \
            -o "$GITHUB_WORKSPACE/TotK-LSFG.apk" \
            --jobs "$(nproc)"
          ls -la "$GITHUB_WORKSPACE/TotK-LSFG.apk"

      - name: Guardar el APK como archivo de la ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: TotK-LSFG
          path: TotK-LSFG.apk

      - name: Publicar el APK en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete lsfg-latest --yes --cleanup-tag || true
          gh release create lsfg-latest TotK-LSFG.apk --title "TotK-LSFG (Lossless Scaling)" --notes "APK con importador de Lossless.dll corregido: el selector de archivos ya funciona." --target "$GITHUB_SHA"
